name: Run Transfer Planner

on:
  workflow_dispatch:

jobs:
  run-planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas
      - name: Run transfer planner
        run: |
          python transfer_planner.py
      - name: Upload planner output
        uses: actions/upload-artifact@v4
        with:
          name: planner-output
          path: planner_output.json
